redesign:
- 'LED tower: fit the 23 x 30 mm LED card and the 20 x 15 x 10 heatsink (need a photo with a ruler and the hole positions)'
- 'X endstop pedestal and vane: 32 x 10 x 21 mm sensor (need hole spacing and slot depth)'
- 'Lens clamp and ring holder: built for a 39 mm barrel and 55 mm working distance at 1.8x. When the lens arrives, measure the height at best
  focus, the barrel diameter and where the zoom ring sits'
- 'Overview arm: USB camera module (step 10)'
- 'Heat-set insert holes: match the insert type you buy'
- 'Optional: Z home with the spare optical endstop (bracket on the column, flag on the focus carriage) so GRBL soft limits work on all three axes'
