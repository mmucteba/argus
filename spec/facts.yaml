# facts: real-world numbers about the parts we buy and the printer we print on
# params.yaml holds our design choices; this file holds what the world is, and how sure we are
#
# status, from weakest to strongest:
#   assumed    our guess
#   listing    a shop page says so
#   datasheet  the maker's drawing or datasheet
#   standard   an iso or industry standard size (m3 nut, 608 bearing, c mount)
#   measured   someone measured our own part with calipers
# only datasheet, standard and measured count as verified; a part that uses anything else is provisional
#
# to verify an item: measure it or find the datasheet, put the proof in evidence/<item>/ (photo with a ruler,
# pdf) or a link in evidence, update values and status, fill by and date, open a pull request
# buy lists the spec/bom.yaml keys this fact comes from; empty means nothing to buy (our printer)
# a fact can only be a listing once its item is picked with a link to one product page
# the code reads these as F.<item>.<value>; never type these numbers into a part

