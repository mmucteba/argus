# argus t18 shared parameters
# units mm g s, z up, optical axis at x=0 y=0, base plate top at z=0
# every part reads its numbers from here, interfaces.yaml or facts.yaml, never hard-code a value another part depends on
# a value can be a formula of facts (facts.yaml) and earlier params, like "lens.d / 2"; then the checks know which parts
# depend on which fact
# bump spec_version on every change; parts built for an older version get flagged by the checks
spec_version: 3
model_version: v0.3
bed: "printer.bed"

# slide and optics
slide_l: "slide.l"
slide_w: "slide.w"
slide_t: "slide.t"
cover_t: "coverslip.t"
label_len: 20.0
mag: "lens.mag_max"           # waveshare zoom lens at full zoom
na: "lens.na_est"             # not published, estimate
wd: "lens.wd_max_zoom"        # working distance at 1.8x, from the listing, measure on arrival
lens_len: "lens.length"
lens_r: "lens.d / 2"
lens_thread: "lens.thread_len"
px_native: "hq_camera.px"
binning: 2
sensor_w: "hq_camera.sensor_w"
sensor_h: "hq_camera.sensor_h"
wavelength: 0.55
pupil_r: 4.0

# motion
x_travel: [-25.0, 70.0]
y_travel: [-15.0, 15.0]
z_travel: [-5.0, 5.0]
lead: "t8_screw.lead"
steps_rev: 200
microsteps: 16
m4_pitch: "m4_rod.pitch"
byj_halfsteps_rev: 4096
nema_hold_ncm: 40.0
nema_pullout_ncm: 15.0
byj_torque_ncm: 3.4
byj_rpm: 15.0
screw_eff: 0.3
m4_eff: 0.2
friction_n: 2.0
accel: 500.0
vmax: 20.0
settle_s: 0.35
capture_s: 0.30
z_spring_n: 3.0
roi: 15.0
overlap: 0.25
time_limit_s: 300.0

# materials and printing
rho_pla: 1.24
fill_pla: 0.55
rho_steel: 7.85
rho_glass: 2.5
e_steel: 200000.0
e_pla: 2300.0
h_per_g: 0.11
min_wall: 1.2
min_gap: 1.0
# printed hole sizes, from the inserts we buy and the fit coupon print
insert_d: "m3_insert.hole_d"
m3_clear_d: "printer_fit.m3_clear"
m4_clear_d: "printer_fit.m4_clear"
m25_tap_d: "printer_fit.m25_tap"
wood_screw_d: "printer_fit.wood_screw"
rod_bore_d: "printer_fit.rod_bore"
lm8uu_seat_d: "printer_fit.lm8uu_seat"
bearing_seat_d: "printer_fit.bearing_seat"

# layout
base: [-137.0, 163.0, -117.0, 153.0]   # x0 x1 y0 y1 of the plywood
base_t: 18.0
xr_y: 44.0          # x rods at y = +/- xr_y
xr_z: 20.0
xs_y: 70.0          # x lead screw y, z
xs_z: 24.0
xb_x: 30.0          # x carriage bearings at x = +/- xb_x
xblk_l: -77.0       # inner faces of the x end blocks
xblk_r: 122.0
xc_z: [28.0, 34.0]  # x carriage plate bottom, top
yr_x: 42.0          # y rods at x = +/- yr_x
yr_z: 44.0
ys_x: 68.0          # y lead screw x, z
ys_z: 47.0
yb_y: 16.0          # y carriage bearings at y = +/- yb_y
yc_z: [54.0, 60.0]  # y carriage plate bottom, top
holder_z: [63.0, 68.2]
diffuser_top: 25.0
zrod_y: 76.0
zrod_x: 18.0
focus_z: [153.0, 189.0, 171.0]   # focus carriage bottom, top, bearing centre
x_endstop: [-63.0, -19.5]        # sensor centre x, y on its pedestal
ring_above_slide: 38.0           # led ring bottom height above the focal plane
overview: {x: 75.0, y: 0.0, z_lens: 177.0, hfov: 66.0, vfov: 41.0, min_focus: 100.0}
uno_origin: [-128.0, -111.0]
pi_origin: [39.0, 90.0]
