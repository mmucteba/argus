# uncertainty audit: opens verify issues for unverified facts, re-check issues for parts whose inputs are all verified,
# marks design issues waiting while their part is provisional, and keeps the Status board issue up to date
name: audit
on:
  push:
    branches: [main]
    paths: ['spec/**', 'parts/**', 'argus/**', 'tools/audit.py', 'tools/task.py']
  schedule:
    - cron: '23 4 * * *'   # every day 07:23 istanbul
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      - name: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/audit.py --sync --md build/status.md
          cat build/status.md >> "$GITHUB_STEP_SUMMARY"
